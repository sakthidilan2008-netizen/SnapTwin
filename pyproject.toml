[project]
name = "snaptwin"
version = "0.1.0"
description = "Causal Execution Twin for Snapdragon Windows PCs — a research prototype for diagnosing application failures on Windows-on-ARM through observation, hypothesis generation, controlled experimentation, and verified remediation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "networkx>=3.2",
    "structlog>=24.1",
    "pefile>=2023.2.7; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
